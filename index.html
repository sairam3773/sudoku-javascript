<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>SUDOKU</h1>
      <div class="levels">
        <button class="level-btn active" data-level="easy">Easy</button>
        <button class="level-btn" data-level="medium">Medium</button>
        <button class="level-btn" data-level="hard">Hard</button>
      </div>
    </header>

    <div class="stats">
      <span id="status">Tap to play</span>
      <div class="stats-right">
        <span id="timer">00:00</span>
        <button id="pausePlay" class="icon-btn" aria-label="Play" title="Play">&#9654;</button>
      </div>
    </div>

    <div class="play-area">
      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>

      <aside class="controls">
        <div class="numpad" id="numpad">
          <button class="num-btn" data-num="1">1</button>
          <button class="num-btn" data-num="2">2</button>
          <button class="num-btn" data-num="3">3</button>
          <button class="num-btn" data-num="4">4</button>
          <button class="num-btn" data-num="5">5</button>
          <button class="num-btn" data-num="6">6</button>
          <button class="num-btn" data-num="7">7</button>
          <button class="num-btn" data-num="8">8</button>
          <button class="num-btn" data-num="9">9</button>
        </div>

        <div class="actions">
          <button id="newGame" class="action-btn">New Game</button>
          <button id="erase" class="action-btn">Erase</button>
          <button id="check" class="action-btn">Check</button>
        </div>
      </aside>
    </div>
  </div>

  <div class="modal" id="winModal" hidden>
    <div class="modal-card">
      <h2>Congratulations!</h2>
      <p id="winMsg">You solved the puzzle.</p>
      <button id="modalNewGame" class="action-btn primary">New Game</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
